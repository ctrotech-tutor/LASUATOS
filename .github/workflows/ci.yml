name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (version from package.json)
        run: |
          npm install --global corepack@latest
          corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Production build (embedded API, as on Vercel)
        run: pnpm --filter @lasuatos/web build
        env:
          NODE_ENV: production
          API_MODE: embedded
          PUBLIC_APP_URL: https://lasuatos.example.app
